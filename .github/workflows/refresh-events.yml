name: Refresh SONIC RADAR and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: '27 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sonic-radar-pages
  cancel-in-progress: false

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan official venue announcements
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: python scripts/refresh_events.py
      - name: Commit refreshed data if changed
        run: |
          git config user.name 'sonic-radar-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/events.json data/events.js
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh upcoming event feed'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
